<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="شيبسى Pro">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07060B" id="metaThemeColor">

<!-- سيتم توليد الـ Manifest والأيقونة كـ PNG ديناميكياً لحل مشكلة الويندوز -->
<link rel="manifest" id="dynamicManifest">

<title>شيبسى | Pro 2026</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Sortable JS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
  /* ============== THEMES ENGINE ============== */
  /* الثيم الداكن (الافتراضي) */
  :root {
    --bg: #07060B; --surface: rgba(255,255,255,0.05); --surface-2: rgba(255,255,255,0.08); --surface-3: rgba(15,13,20,0.95);
    --border: rgba(255,255,255,0.1); --border-strong: rgba(255,255,255,0.18);
    --text-1: #ffffff; --text-2: #C4C0CC; --text-3: #8B8795;
    --primary: #E8B84B; --primary-2: #F4D06F; --primary-soft: rgba(232,184,75,0.15); --btn-text: #1a1420;
    --aurora-1: rgba(232,184,75,.3); --aurora-2: rgba(72,90,255,.2); --aurora-3: rgba(255,90,120,.2); 
    --aurora-opacity: 0.8; --radius: 20px;
    --green: #3DDC84; --green-soft: rgba(61,220,132,0.16);
    --red: #FF6B6B; --red-soft: rgba(255,107,107,0.16);
    --shadow: rgba(0,0,0,0.4); 
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    --cat-col-width: 135px;
  }

  /* الثيم الفاتح (Pearl Glassmorphism - مستوحى من أداة التفعيل) */
  [data-theme="light"] {
    --bg: #E9EDF3; /* رمادي مزرق فاتح ومريح جداً */
    --surface: rgba(255,255,255,0.45); /* زجاج نصف شفاف */
    --surface-2: rgba(255,255,255,0.65);
    --surface-3: rgba(255,255,255,0.95); /* صلب للقوائم */
    --border: rgba(255,255,255,0.9); /* حدود زجاجية بيضاء */
    --border-strong: rgba(0,40,90,0.15); /* حدود فاصلة ناعمة */
    --text-1: #16202E; /* كحلي غامق بدلاً من الأسود الصريح لراحة العين */
    --text-2: #4A5A70;
    --text-3: #7D8CA0;
    --primary: #C28200; /* ذهبي داكن ليتناسب مع الخلفية المضيئة */
    --primary-2: #E8B84B; 
    --primary-soft: rgba(212,154,42,0.18); 
    --btn-text: #ffffff;
    --aurora-1: rgba(0,122,255,0.15); --aurora-2: rgba(212,154,42,0.15); --aurora-3: rgba(255,90,120,0.12); 
    --aurora-opacity: 1;
    --shadow: rgba(30,60,110,0.12); /* ظلال مزرقة خفيفة للعمق */
  }

  /* ============== BASE STYLES ============== */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{ margin:0; background:var(--bg); font-family:'Tajawal', sans-serif; color:var(--text-1); height:100dvh; overflow:hidden; display:flex; flex-direction:column; background-size: cover; background-position: center; transition: background-color 0.4s, color 0.4s; }
  
  /* Aurora Background */
  .aurora{ position:fixed; inset:0; z-index:0; opacity: var(--aurora-opacity); pointer-events: none; overflow:hidden; transition: 0.4s;}
  .aurora::before{ content:''; position:absolute; inset:-20%; background: radial-gradient(closest-side, var(--aurora-1), transparent), radial-gradient(closest-side, var(--aurora-2), transparent), radial-gradient(closest-side, var(--aurora-3), transparent), radial-gradient(closest-side, var(--primary-soft), transparent); background-size:65% 65%, 70% 70%, 50% 50%, 55% 55%; background-position: 15% 20%, 85% 15%, 50% 80%, 20% 85%; filter:blur(60px) saturate(130%); }
  .aurora::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 0%, transparent 35%, var(--bg) 92%); opacity:0.85; transition: 0.4s;}

  /* ---------- App Bar ---------- */
  .appbar{ padding:calc(15px + var(--safe-top)) 16px 10px; z-index:2; flex-shrink:0; }
  .appbar-row{ display:flex; align-items:center; justify-content:space-between; gap: 12px; margin-bottom: 8px;}
  .appbar-title{ font-size:22px; font-weight:900; letter-spacing:-.4px; color:var(--primary); text-shadow:0 2px 10px rgba(0,0,0,0.2); flex-shrink:0; }
  .appbar-actions { display: flex; gap: 8px; align-items: center; flex-shrink:0; }
  
  .search-bar{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:100px; padding:8px 14px; backdrop-filter:blur(12px); box-shadow:0 4px 15px var(--shadow); flex:1; transition:0.2s; }
  .search-bar:focus-within { border-color:var(--primary); background:var(--surface-3); }
  .search-bar input{ border:none; background:transparent; outline:none; color:var(--text-1); font-family:inherit; font-size:14.5px; width:100%; font-weight:800;}
  .search-bar input::placeholder{ color:var(--text-3); font-weight:600;}
  .search-bar svg{ color:var(--text-2); opacity:0.8; flex-shrink:0; }

  .icon-btn{ width:38px; height:38px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; color:var(--text-1); cursor:pointer; box-shadow:0 4px 15px var(--shadow); transition:0.2s;}
  .icon-btn:active{ transform:scale(.92); background:var(--surface-3); }
  .icon-btn.danger-tint { color: var(--red); background: var(--red-soft); border-color: var(--red); }
  
  .icon-btn-sm{ width:34px; height:34px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-2); border:1px solid var(--border); cursor:pointer; box-shadow:0 2px 8px var(--shadow);}
  .icon-btn-sm:active{ transform:scale(.85); color:var(--primary); background:var(--primary-soft); border-color:var(--primary);}

  /* ---------- Content ---------- */
  .content{ flex:1; overflow-y:auto; padding:10px 14px 130px; z-index:2; display:flex; flex-direction:column; }
  .content::-webkit-scrollbar{ width:0; }
  
  /* ================= البطاقات المدمجة ================= */
  .compact-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) * 0.75);
    padding: 8px 10px;
    margin-bottom: 8px;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 12px var(--shadow);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  /* تعديلات الثيم الفاتح للبطاقات */
  [data-theme="light"] .compact-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.4));
    box-shadow: 0 8px 24px rgba(30,60,110,0.08);
  }

  .cat-name-col {
    width: var(--cat-col-width);
    min-width: 90px;
    max-width: 60vw;
    display: flex;
    align-items: center;
    gap: 8px;
    border-left: 1px solid var(--border-strong);
    padding-left: 8px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .sync-resize {
    resize: horizontal;
    overflow: hidden;
    border-left: 2px solid var(--border-strong);
    padding-left: 14px;
    position: relative;
  }
  .sync-resize::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 2px;
    width: 8px;
    height: 8px;
    background: linear-gradient(135deg, transparent 40%, var(--text-3) 40%);
    pointer-events: none;
    opacity: 0.5;
  }

  /* تصميم الأطعمة الأساسي */
  .flavor-item { 
    background: var(--surface-3);
    border: 1.5px solid var(--border-strong);
    padding: 8px 14px; 
    border-radius: calc(var(--radius)*0.5); 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    min-width: 75px; 
    cursor: pointer; 
    box-shadow: 0 2px 5px var(--shadow);
    transition: 0.1s;
    user-select: none;
  }
  [data-theme="light"] .flavor-item {
    background: rgba(255,255,255,0.85);
    box-shadow: 0 4px 10px rgba(30,60,110,0.05);
  }

  .flavor-item .color-dot {
    width: 10px; 
    height: 10px;
    border-radius: 50%;
    background: var(--item-color); 
    box-shadow: 0 0 6px var(--item-color);
  }
  .flavor-item span { 
    font-weight: 900; 
    font-size: 15px; 
    color: var(--text-1); 
  }
  [data-theme="light"] .flavor-item span { text-shadow: none; }
  
  .flavor-item:active { transform: scale(0.92); }
  
  /* حالة التحديد */
  .flavor-item.selected {
    background: var(--surface-2);
    border-color: var(--item-color);
    box-shadow: inset 0 0 12px rgba(255,255,255,0.05), 0 0 8px var(--item-color);
  }
  .flavor-item.selected span {
    color: var(--text-1);
    text-shadow: 0 0 8px var(--item-color);
  }
  
  [data-theme="light"] .flavor-item.selected {
    background: var(--primary-soft);
    box-shadow: 0 4px 12px rgba(212,154,42,0.15), inset 0 0 0 1px var(--item-color);
  }
  [data-theme="light"] .flavor-item.selected span { text-shadow: none; color: var(--text-1); }

  /* بطاقات عادية */
  .form-card{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; backdrop-filter:blur(12px); box-shadow:0 12px 30px var(--shadow); }
  [data-theme="light"] .form-card { background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6)); }

  /* Inputs & Fields */
  .field{ background:var(--surface-3); border:1px solid var(--border); border-radius:calc(var(--radius)*0.6); padding:16px 16px; margin-bottom:14px; display:flex; align-items:center;}
  .field:focus-within{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .field input, .field select{ border:none; background:transparent; outline:none; color:var(--text-1); width:100%; font-family:inherit; font-size:15.5px; font-weight:800; appearance: none;}
  .field input::placeholder{ color:var(--text-3); font-weight:600;}
  .field select option { background: var(--surface-3); color: var(--text-1); }

  .btn-primary{ width:100%; background:linear-gradient(135deg,var(--primary-2),var(--primary)); color:var(--btn-text); border:none; border-radius:calc(var(--radius)*0.6); padding:16px; font-family:inherit; font-size:16.5px; font-weight:900; cursor:pointer; box-shadow:0 8px 24px var(--primary-soft); display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary:active{ transform:scale(.97); }

  /* ===================== TAB BAR ===================== */
  .tabbar-wrap{ position:fixed; left:0; right:0; bottom:0; z-index:40; padding:0 18px calc(18px + var(--safe-bottom)); display:flex; justify-content:center; pointer-events:none; }
  .tabbar{ pointer-events:auto; display:flex; gap:6px; align-items:center; background:var(--surface-3); backdrop-filter:blur(15px); border:1px solid var(--border-strong); border-radius:32px; padding:7px; box-shadow:0 16px 40px -12px var(--shadow); }
  .tab{ display:flex; align-items:center; gap:8px; padding:12px 16px; border-radius:26px; cursor:pointer; color:var(--text-3); transition:all .2s ease; position:relative; overflow:hidden; }
  .tab svg{ flex-shrink:0; }
  .tab span{ font-size:14px; font-weight:900; white-space:nowrap; max-width:0; opacity:0; transition:max-width .2s ease, opacity .1s ease, margin .2s ease; overflow:hidden;}
  .tab.active{ color:var(--btn-text); background:linear-gradient(135deg,var(--primary-2),var(--primary)); box-shadow:0 8px 20px -6px var(--primary-soft); padding-inline-end:18px; }
  .tab.active span{ max-width:120px; opacity:1; margin-inline-start:2px; }
  .tab:not(.active):active{ transform:scale(.9); background:var(--surface-2); }

  /* ================= BOTTOM SHEETS & DIALOGS ================= */
  .sheet-overlay, .dialog-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:0.2s; z-index:100; display:flex; flex-direction:column; justify-content:flex-end; }
  .sheet-overlay.show, .dialog-overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{ background:var(--surface-3); backdrop-filter:blur(20px); border-radius:var(--radius) var(--radius) 0 0; border:1px solid var(--border-strong); border-bottom:none; padding:15px 20px calc(24px + var(--safe-bottom)); transform:translateY(100%); transition:transform .3s cubic-bezier(.2, .9, .3, 1); max-height:92vh; overflow-y:auto; display:flex; flex-direction:column; box-shadow:0 -10px 40px var(--shadow); }
  .sheet-overlay.show .sheet{ transform:translateY(0); }
  .sheet-handle{ width:45px; height:6px; background:var(--border-strong); border-radius:10px; margin:0 auto 20px; flex-shrink:0; }
  
  .dialog-box { margin: auto; background:var(--surface-3); border:1px solid var(--border-strong); backdrop-filter:blur(20px); border-radius:var(--radius); padding:28px 24px; width:85%; max-width:380px; text-align:center; transform:scale(0.95); transition:0.2s cubic-bezier(.2,.9,.3,1); box-shadow:0 20px 50px rgba(0,0,0,0.8); }
  .dialog-overlay.show .dialog-box { transform:scale(1); }

  .sheet-cancel{ width:100%; background:transparent; border:none; color:var(--text-3); font-family:inherit; font-size:15px; font-weight:900; padding:16px; margin-top:8px; cursor:pointer;}
  .sheet-cancel:active { color:var(--red); }

  /* ================= Manage Row ================= */
  .manage-row { display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:10px 12px; margin-bottom:10px; transition:0.2s;}
  .manage-row-disabled { opacity: 0.5; filter: grayscale(1); }
  .drag-handle { opacity:0.3; cursor:grab; padding:4px; flex-shrink:0;}
  .drag-handle:active { cursor:grabbing; }
  
  .manage-input { flex:1; background:rgba(0,0,0,0.2); padding:8px 12px; border-radius:8px; border:1px solid var(--border); color:var(--text-1); font-family:inherit; font-weight:800; text-align:right; min-width:60px; outline:none; transition:0.2s;}
  .manage-input:focus { border-color:var(--primary); background:var(--surface-2); }
  [data-theme="light"] .manage-input { background:var(--surface-3); border-color:var(--border-strong); }

  /* Color Drawer */
  .color-drawer { position: absolute; left: 50%; transform: translateX(-50%) scale(0.9); background: var(--surface-3); border: 1px solid var(--border-strong); padding: 12px; border-radius: calc(var(--radius)*0.8); display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; z-index: 110; opacity: 0; visibility: hidden; transition: 0.2s; box-shadow: 0 10px 30px var(--shadow); }
  .color-drawer.open { opacity: 1; visibility: visible; transform: translateX(-50%) scale(1); }
  .color-drawer-up { bottom: 120%; top: auto; }
  .color-drawer-down { top: 120%; bottom: auto; }
  
  .toggle-switch { position: relative; width: 44px; height: 24px; cursor: pointer; flex-shrink:0;}
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--surface-2); border:1px solid var(--border-strong); border-radius: 34px; transition: .3s; }
  .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text-3); border-radius: 50%; transition: .3s; }
  input:checked + .slider { background-color: var(--green-soft); border-color:var(--green); }
  input:checked + .slider:before { transform: translateX(20px); background-color: var(--green); }

  /* Order UI styling */
  .order-flavor-capsule { background: var(--surface-2); border: 1.5px solid; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; height: 38px; overflow: hidden; position: relative; flex:1; min-width:110px; }
  .order-flavor-capsule:active { transform: scale(0.95); }
  .order-flavor-capsule .qty { background: var(--text-1); color: var(--bg); font-weight: 900; font-size: 15px; width: 35px; height: 100%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  [data-theme="light"] .order-flavor-capsule .qty { background: var(--text-1); color: #fff; }
  .order-flavor-capsule .name { font-weight: 800; font-size: 12px; color: var(--text-1); flex-grow: 1; text-align: center; padding: 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .order-item-remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; background: var(--red); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; border: 2px solid var(--surface-3); opacity: 0; transition: opacity 0.2s; }
  .order-flavor-capsule:hover .order-item-remove { opacity: 1; }

  .share-list { list-style: none; display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
  .share-list a { width: 55px; height: 55px; border-radius: 50%; color: var(--text-1); background: var(--surface-2); border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; cursor:pointer;}
  .share-list a:hover { transform: scale(1.1); background-color: var(--primary-soft); border-color: var(--primary); color: var(--primary); }

  /* Loader */
  #globalLoader { position:fixed; top:20px; left:20px; z-index:9999; background:var(--surface-3); border:1px solid var(--border); border-radius:50%; width:44px; height:44px; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:0.2s; box-shadow:0 4px 15px var(--shadow);}
  .spinner { width:24px; height:24px; border:3px solid var(--border-strong); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* FAB */
  .fab { position:fixed; bottom:90px; right:20px; z-index:30; width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg, var(--primary-2), var(--primary)); color:var(--btn-text); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 25px var(--primary-soft); border:none; cursor:pointer; }
  .fab:active { transform:scale(0.9); }

  /* Maintenance Overlay */
  .overlay-maintenance {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 35;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius);
  }
  [data-theme="light"] .overlay-maintenance { background: rgba(255, 255, 255, 0.6); }
  
  .overlay-maintenance h2 {
    font-size: 34px;
    font-weight: 900;
    color: var(--primary);
    margin: 0 0 8px;
    letter-spacing: 1px;
    text-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .overlay-maintenance p {
    font-size: 16px;
    color: var(--text-1);
    font-weight: 800;
    margin: 0;
  }

  /* Settings Menu Elements */
  .setting-row { display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); padding:16px; border-radius:12px; margin-bottom:12px; border:1px solid var(--border); cursor:pointer;}
  .setting-row:active { background:var(--surface-3); transform:scale(0.98); }
  .setting-row span { font-weight:800; font-size:15px; color:var(--text-1);}
</style>
</head>
<body>

<div class="aurora"></div>
<div class="grain"></div>
<div id="globalLoader"><div class="spinner"></div></div>

<!-- ===================== VIEW 1: HOME (المخزن) ===================== -->
<div id="view-home" style="display:flex; flex-direction:column; height:100%;">
  <div class="appbar">
    <div class="appbar-row">
      <div class="appbar-title" id="mainTitle">شيبسى</div>
      
      <!-- حقل البحث -->
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="headerSearch" type="text" oninput="handleSearch(this.value)" placeholder="بحث سريع..." autocomplete="off">
      </div>

      <div class="appbar-actions">
        <!-- زر إلغاء تحديد الكل (فوري) بأيقونة معبرة -->
        <div class="icon-btn" onclick="deselectAll()" title="إلغاء تحديد الكل">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke-dasharray="4 4" /><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, query, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { get, set, del } from "https://cdn.jsdelivr.net/npm/idb-keyval@6/+esm"; 

    const firebaseConfig = { apiKey: "AIzaSyALzGGhWxE7tLpt2UafQFsdsEk8g-84Zt4", authDomain: "chipsy-ec910.firebaseapp.com", projectId: "chipsy-ec910", storageBucket: "chipsy-ec910.appspot.com", messagingSenderId: "630213334424", appId: "1:630213334424:web:1788b43f37c40c43ee87ed" };
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'chipsy-pro-2026';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let snacks = [];
    let shortagesMap = JSON.parse(localStorage.getItem('chipsy_shortages') || '{}'); 
    let currentEditingCategory = "";
    let categoryOrder = [];
    const colors = ["#f43f5e", "#fb923c", "#facc15", "#4ade80", "#3b82f6", "#8b5cf6", "#ffffff", "#000000", "#1e3a8a", "#64748b"];

    const triggerHaptic = (ms = 20) => { if (navigator.vibrate) navigator.vibrate(ms); };
    const toggleLoader = (show) => { document.getElementById('globalLoader').style.opacity = show ? '1' : '0'; };

    let pendingConfirmAction = null;
    window.showConfirm = (title, message, btnText, actionCallback) => {
        triggerHaptic(40);
        document.getElementById('confirmTitle').innerText = title;
        document.getElementById('confirmMessage').innerText = message;
        document.getElementById('btnConfirmAction').innerText = btnText;
        pendingConfirmAction = actionCallback;
        toggleModal('confirmDialog', true);
    };
    document.getElementById('btnConfirmAction').addEventListener('click', () => {
        if(pendingConfirmAction) pendingConfirmAction();
        toggleModal('confirmDialog', false);
    });
    window.closeConfirm = (e) => {
        if(e.target.id === 'confirmDialog') toggleModal('confirmDialog', false);
    };

    const savedTheme = localStorage.getItem('chipsy_theme') || 'dark';
    if(savedTheme === 'light') document.body.setAttribute('data-theme', 'light');
    
    window.toggleTheme = () => {
      triggerHaptic(30);
      const isLight = document.body.getAttribute('data-theme') === 'light';
      if(isLight) {
        document.body.removeAttribute('data-theme');
        localStorage.setItem('chipsy_theme', 'dark');
      } else {
        document.body.setAttribute('data-theme', 'light');
        localStorage.setItem('chipsy_theme', 'light');
      }
    };

    window.toggleModal = (id, show) => {
      const el = document.getElementById(id);
      if(show) { el.classList.add('show'); triggerHaptic(); }
      else el.classList.remove('show');
    };
    window.closeSheetOnScrim = (e, id) => {
      if(e.target.id === id) toggleModal(id, false);
    };
    
    window.switchTab = (tab) => {
      triggerHaptic(20);
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('view-home').style.display = 'none';
      document.getElementById('view-categories').style.display = 'none';
      document.getElementById('view-order').style.display = 'none';

      if(tab === 'home') {
        document.getElementById('tabHome').classList.add('active');
        document.getElementById('view-home').style.display = 'flex';
        window.render(document.getElementById('headerSearch').value);
        setTimeout(() => document.getElementById('headerSearch').focus(), 50);
      } else if(tab === 'categories') {
        document.getElementById('tabCategories').classList.add('active');
        document.getElementById('view-categories').style.display = 'flex';
        renderCategoriesTab(document.getElementById('catSearch').value);
      } else if(tab === 'order') {
        document.getElementById('tabOrder').classList.add('active');
        document.getElementById('view-order').style.display = 'flex';
        generateOrderView();
      }
    };

    const savedColWidth = localStorage.getItem('chipsy_col_width');
    if(savedColWidth) document.documentElement.style.setProperty('--cat-col-width', `${savedColWidth}px`);

    const startSession = async () => { 
        try { 
            toggleLoader(true);
            await signInAnonymously(auth); 
            initAddModalColors(); 
            setTimeout(() => document.getElementById('headerSearch').focus(), 300);
        } catch (e) { 
            updateSyncStatus('offline'); 
        } finally {
            toggleLoader(false);
        }
    };

    const initDropdown = () => {
        const group = document.getElementById('catOptionsGroup');
        if (group) { 
            group.innerHTML = ""; 
            categoryOrder.forEach(cat => { 
                const opt = document.createElement('option'); opt.value = cat; opt.innerText = cat; group.appendChild(opt); 
            }); 
        }
    };

    const initAddModalColors = () => {
        const drawer = document.getElementById('addColorDrawer');
        if (drawer) { drawer.innerHTML = colors.map(c => `<button onclick="setAddColor('${c}')" style="width:32px; height:32px; border-radius:50%; border:2px solid var(--border-strong); background-color: ${c}"></button>`).join(''); }
        const inlineDrawer = document.getElementById('inlineColorDrawer');

            delete shortagesMap[id];
        } else {

        }
        localStorage.setItem('chipsy_shortages', JSON.stringify(shortagesMap));

        if(el) el.classList.toggle('selected');

    };

    let colResizeObserver = new ResizeObserver(entries => {
        for (let entry of entries) {
            const newWidth = entry.borderBoxSize ? entry.borderBoxSize[0].inlineSize : entry.contentRect.width;
            if (newWidth > 50) { 
                document.documentElement.style.setProperty('--cat-col-width', `${newWidth}px`);
                localStorage.setItem('chipsy_col_width', newWidth);
            }
        }
    });

    window.render = (searchQuery = "") => {
        const container = document.getElementById('mainContainer');
        if (!container) return;
        const search = searchQuery.toLowerCase();
        container.innerHTML = "";
        const grouped = {};
        
        snacks.forEach(s => {
            if ((s.name.toLowerCase().includes(search) || s.category.toLowerCase().includes(search)) && s.available) {
                if (!grouped[s.category]) grouped[s.category] = [];
                grouped[s.category].push(s);
            }
        });
        
        if (Object.keys(grouped).length === 0) { 
            container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-3); font-weight:800;">لا توجد نتائج</div>`; 
            return; 
        }
        
        const sortedCats = Object.keys(grouped).sort((a, b) => {
            let idxA = categoryOrder.indexOf(a); let idxB = categoryOrder.indexOf(b);
            if(idxA === -1) idxA = 999; if(idxB === -1) idxB = 999;
            return idxA - idxB;
        });
        
        sortedCats.forEach((cat, index) => {
            const sortedFlavors = grouped[cat].sort((a,b) => (a.order || 0) - (b.order || 0));
            const availableCount = snacks.filter(s => s.category === cat && s.available).length;
            
            const isFirst = index === 0;

                        return `<div onclick="toggleOrderSelection('${i.id}')" data-id="${i.id}" class="flavor-item ${isSelected ? 'selected' : ''}" style="--item-color: ${i.color};" title="اضغط للإضافة للطلبية">

                    }).join('')}

                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 005 15a1.65 1.65 0 00-1.51-1H3.5a2 2 0 010-4h.09A1.65 1.65 0 005 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 5a1.65 1.65 0 001-1.51V3.5a2 2 0 014 0v.09A1.65 1.65 0 0015 5a1.65 1.65 0 001.82.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                </button>
            `;
            container.appendChild(card);
        });

        catSearchTimeout = setTimeout(() => { window.renderCategoriesTab(val); }, 20);
    };

    window.renderCategoriesTab = (searchQuery = "") => {
        const area = document.getElementById('categoriesListArea');
        area.innerHTML = "";
        let uniqueCats = [...new Set(snacks.map(s => s.category))];
        
        const sq = searchQuery.toLowerCase().trim();
        if (sq) {
            uniqueCats = uniqueCats.filter(c => c.toLowerCase().includes(sq));
        }

        uniqueCats.sort((a,b) => {
            let idxA = categoryOrder.indexOf(a); let idxB = categoryOrder.indexOf(b);

            return idxA - idxB;
        });

        uniqueCats.forEach(catName => {
            const btn = document.createElement('div');
            btn.className = "manage-row";
            btn.dataset.name = catName;

                } catch(e) {} toggleLoader(false);
            }
        });
    };

    window.confirmDeleteCategory = () => {
        toggleModal('manageCategorySheet', false);
        setTimeout(() => {
            showConfirm('حذف الفئة بالكامل', `هل أنت متأكد من حذف فئة "${currentEditingCategory}" وجميع الأطعمة بداخلها نهائياً؟`, 'حذف فوراً', async () => {
                toggleLoader(true);
                try {
                    const batch = writeBatch(db);
                    const itemsToDelete = snacks.filter(s => s.category === currentEditingCategory);
                    itemsToDelete.forEach(item => {
                        batch.delete(doc(db, 'artifacts', appId, 'public', 'data', 'stock', item.id));
                    });
                    
                    categoryOrder = categoryOrder.filter(c => c !== currentEditingCategory);
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), { categoryOrder }, { merge: true });
                    
                    await batch.commit();
                    
                    itemsToDelete.forEach(item => {
                        delete shortagesMap[item.id];
                    });
                    localStorage.setItem('chipsy_shortages', JSON.stringify(shortagesMap));
                    
                } catch(e) { console.error(e); }
                toggleLoader(false);
            });
        }, 300);
    };

    window.openManageCategory = (catName, initSort = true) => {
        triggerHaptic(30);
        currentEditingCategory = catName;
        const listArea = document.getElementById('manageListArea');
        const catSnacks = snacks.filter(s => s.category === catName).sort((a,b) => (a.order || 0) - (b.order || 0));

            div.innerHTML = `
                <div class="drag-handle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg></div>

                <div style="position:relative;">
                    <button id="color-preview-${item.id}" onclick="toggleColorDrawer(this)" style="width:28px; height:28px; border-radius:50%; border:2px solid var(--border); background-color: ${item.color}; box-shadow:0 2px 5px var(--shadow);"></button>
                    <div class="color-drawer ${drawerDir}">
                        ${colors.map(c => `<button onclick="fastUpdateColor('${item.id}', '${c}')" style="width:28px; height:28px; border-radius:50%; border:2px solid ${item.color===c?'var(--text-1)':'var(--border-strong)'}; background-color:${c}"></button>`).join('')}
                    </div>

                <button onclick="deleteItem('${item.id}')" class="icon-btn-sm" style="color:var(--red); background:var(--red-soft); border-color:var(--red); flex-shrink:0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>`;
            listArea.appendChild(div);
        });
        
        toggleModal('manageCategorySheet', true);
        
        if (initSort) { 
            new Sortable(listArea, {

                        const batch = writeBatch(db);
                        items.forEach((el, index) => {
                            batch.update(doc(db, 'artifacts', appId, 'public', 'data', 'stock', el.dataset.id), { order: index });
                        });
                        await batch.commit(); 
                    } catch(e) {}
                }
            }); 
        }
    };

    window.toggleStatusLocal = async (id, isChecked) => { 
        triggerHaptic(20); 
        const row = document.querySelector(`div[data-id="${id}"]`);
        if(row) { if(isChecked) row.classList.remove('manage-row-disabled'); else row.classList.add('manage-row-disabled'); }
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stock', id), { available: isChecked }); 
    };
    window.fastUpdateColor = async (id, c) => {
        triggerHaptic(20);
        const preview = document.getElementById(`color-preview-${id}`);
        if(preview) preview.style.backgroundColor = c;
        const drawer = preview.nextElementSibling;
        if(drawer) drawer.classList.remove('open');
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stock', id), { color: c });
    };
    window.saveCategoryName = async () => {
        const newName = document.getElementById('renameCategoryInput').value.trim();
        if (!newName || newName === currentEditingCategory) return;
        toggleLoader(true);
        const batch = writeBatch(db);
        snacks.filter(s => s.category === currentEditingCategory).forEach(item => { batch.update(doc(db, 'artifacts', appId, 'public', 'data', 'stock', item.id), { category: newName }); });
        
        const catIndex = categoryOrder.indexOf(currentEditingCategory);
        if(catIndex !== -1) {
            categoryOrder[catIndex] = newName;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), { categoryOrder }, { merge: true });
        }
        await batch.commit(); currentEditingCategory = newName;
        document.getElementById('categoryStats').innerText = "تم التحديث بنجاح ✓";
        toggleLoader(false);
        setTimeout(() => { openManageCategory(newName, false); }, 400);
    };

    window.toggleColorDrawer = (btn) => { const drawer = btn.nextElementSibling; document.querySelectorAll('.color-drawer').forEach(d => { if(d !== drawer) d.classList.remove('open')}); drawer.classList.toggle('open'); };
    window.fastUpdate = async (id, f, v) => { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stock', id), { [f]: v }); };
    
    window.handleCatChange = (v, wrap) => { 
        const el = document.getElementById(wrap); 
        if(v === 'CUSTOM') el.classList.remove('hidden'); 
        else el.classList.add('hidden'); 
    };
    
    window.saveItem = async () => { 
        const name = document.getElementById('nameInput').value.trim(); 
        const selectVal = document.getElementById('catSelect').value; 
        let category = selectVal === 'CUSTOM' ? document.getElementById('customCatInput').value.trim() : selectVal; 
        if (!name || !category) return; 
        toggleLoader(true);
        const newOrder = snacks.filter(s => s.category === category).length; 
        await setDoc(doc(collection(db, 'artifacts', appId, 'public', 'data', 'stock')), { name, category, color: document.getElementById('addColorPreview').style.backgroundColor, available: true, createdAt: Date.now(), order: newOrder }); 
        
        if(!categoryOrder.includes(category)) {
            categoryOrder.push(category);
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), { categoryOrder }, { merge: true });
        }
        document.getElementById('nameInput').value = ""; 
        toggleModal('addSheet', false); 
        toggleLoader(false);
    };
    
    window.inlineAddItem = async () => {
        const name = document.getElementById('inlineAddInput').value.trim();
        if (!name || !currentEditingCategory) return;
        toggleLoader(true);
        const color = document.getElementById('inlineColorPreview').style.backgroundColor;
        const newOrder = snacks.filter(s => s.category === currentEditingCategory).length;
        await setDoc(doc(collection(db, 'artifacts', appId, 'public', 'data', 'stock')), { name, category: currentEditingCategory, color, available: true, createdAt: Date.now(), order: newOrder });
        document.getElementById('inlineAddInput').value = "";
        toggleLoader(false);

            toggleLoader(false);

        const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        const ref = `SR-${now.getMonth() + 1}${now.getDate()}${now.getFullYear().toString().slice(-2)}`;
        const sep = `━━━━━━━━━━━━━━━━━━━━━━\n`;
        let message = sep + `        📦 RESTOCK FORM\n` + sep + `Date: ${dateStr} | ${timeStr}\n` + `Ref : ${ref}\n` + sep + `\n`;

        const groupedShortages = {};
        snacks.forEach(s => {
            if (!s.available || (shortagesMap[s.id] !== undefined && shortagesMap[s.id] > 0)) {
                if (!groupedShortages[s.category]) groupedShortages[s.category] = [];
                groupedShortages[s.category].push({ ...s, qty: shortagesMap[s.id] || 0 });
            }
        });

        const sortedCats = Object.keys(groupedShortages).sort((a, b) => {
            let idxA = categoryOrder.indexOf(a); let idxB = categoryOrder.indexOf(b);
            if(idxA === -1) idxA = 999; if(idxB === -1) idxB = 999;
            return idxA - idxB;
        });
        
        if (sortedCats.length === 0) return;

        sortedCats.forEach(cat => {
            message += `📦 ${cat}\n`;
            const flavors = groupedShortages[cat].sort((a,b) => (a.order || 0) - (b.order || 0));
            let lines = [];
            for (let i = 0; i < flavors.length; i += 5) { lines.push(flavors.slice(i, i + 5).map(f => `${f.qty} ${f.name}`).join(' – ')); }
            message += lines.join('\n') + `\n\n` + sep + `\n`;
        });
        message += `🔒 System Generated Document`;

        try { await navigator.clipboard.writeText(message); alert("تم التجهيز والنسخ للحافظة بنجاح!"); } catch (err) { console.error("Clipboard failed"); }

        const encodedMsg = encodeURIComponent(message);
        if (platform === 'WhatsApp') window.open(`https://api.whatsapp.com/send?text=${encodedMsg}`, '_blank');
        else if (platform === 'Telegram') window.open(`https://t.me/share/url?url=&text=${encodedMsg}`, '_blank');
    };

    window.closeOrderMode = () => { 
        showConfirm('تفريغ الطلبية', 'هل أنت متأكد من رغبتك في تفريغ الطلبية الحالية بالكامل؟', 'تفريغ', () => {
            shortagesMap = {}; 
            localStorage.removeItem('chipsy_shortages'); 
            renderOrderItems(); 
        });
    };
    
    window.updateBg = async (input) => { 
        if (input.files[0]) { toggleLoader(true); const reader = new FileReader(); reader.onload = async (e) => { const result = e.target.result; document.body.style.backgroundImage = `url('${result}')`; try { await set('chipsy_ultimate_bg', result); } catch(err) {} toggleLoader(false); }; reader.readAsDataURL(input.files[0]); } 
    };
    window.removeBg = async () => { triggerHaptic(40); document.body.style.backgroundImage = 'none'; await del('chipsy_ultimate_bg'); };
    
    get('chipsy_ultimate_bg').then(savedBg => { if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`; }).catch(err => {});

    // ================= PWA Setup (Auto Generate Manifest & SW) =================
    if ('serviceWorker' in navigator) {
        // 1. توليد أيقونة PNG عن طريق Canvas للويندوز
        const generateAppIcon = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#E8B84B';
            ctx.beginPath(); ctx.roundRect(0, 0, 512, 512, 120); ctx.fill();
            ctx.fillStyle = '#07060B';
            ctx.font = 'bold 280px "Tajawal", Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('ش', 256, 300);
            return canvas.toDataURL('image/png');
        };

        // 2. إنشاء وتفعيل الـ Manifest
        const manifestData = {
          name: "شيبسى Pro",
          short_name: "Chipsy",
          start_url: window.location.href.split('?')[0],
          display: "standalone",
          background_color: "#07060B",
          theme_color: "#E8B84B",
          icons: [{
            src: generateAppIcon(),
            sizes: "512x512",
            type: "image/png",
            purpose: "any maskable"
          }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        document.getElementById('dynamicManifest').href = URL.createObjectURL(manifestBlob);

        // 3. إنشاء وتفعيل Service Worker حقيقي لمتطلبات التثبيت
        const swCode = `
          const CACHE_NAME = 'chipsy-v1';
          self.addEventListener('install', e => { self.skipWaiting(); });
          self.addEventListener('activate', e => { self.clients.claim(); });
          self.addEventListener('fetch', e => { 
             e.respondWith(fetch(e.request).catch(() => new Response('Offline mode')));
          });
        `;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
    }

    startSession();
</script>
</body>
